<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Homework 08</title>
</head>
<body>
    <section class="signup-card">
        <div class="container">
            <div >
                <div class="card-header">
                    <h3 class="premium-title">Premium</h3>
                    <h3 class="price">$199/<span class="price-span">month</span></h3>
                </div>
                <p class="card-header-describtion">Faster Instagram Growth</p>
            </div>

            <form action="#" class="signup-form">
                <input type="email" placeholder="Email" class="input-container"/>
                <input type="text" placeholder="Cardholder Name" class="input-container"/>
                    <div class="card-input">
                        <input type="text" placeholder="Card Number" class="input-container"/>
                        <img src="./images/credit-card.svg" class="credit-card"/>
                    </div>
                    <div class="date-cvv">
                        <input type="text" placeholder="Date" class="date-input"/>
                        <input type="text" placeholder="CVV" class="cvv-zip"/>
                    </div>
                <div class="country-select-container"><!-- 
                    <label for="country"></label> -->
                    <select id="country"  class="country-dropdown">
                        <option value="">Country</option>
                        <option value="US">United States</option>
                        <option value="CN">China</option>
                        <option value="GE">Georgia</option>
                    </select>
                    <input type="text" placeholder="Zip" class="cvv-zip"/>
                </div>
                <input type="text" placeholder="Discount Code" class="input-container"/>
            </form>

            <div class="terms-container">
                <input type="checkbox" class="checkbox-box"/>
                <p class="terms">I accept the <a href="#" class="terms-links">Terms of Service</a> and <a href="#" class="terms-links">Privacy Policy</a></p>
            </div>
            <div class="buttons">
            <button class="get-started">Get started | $199 <span class="old-price"> $249</span></button>
            <button class="coupon">Have a coupon?</button>
            </div>
        </div>
    </section>
</body>
</html>
