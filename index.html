<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Homework 08</title>
</head>
<body>
    <section class="signup-card">
        <div class="container">
            <div >
                <div class="card-header">
                    <h3 class="premium-title">Premium</h3>
                    <h3 class="price">$199/<span class="price-span">month</span></h3>
                </div>
                <p class="card-header-describtion">Faster Instagram Growth</p>
            </div>

            <form action="#" class="signup-form">
                <input type="email" placeholder="Email"/>
                <input type="text" placeholder="Cardholder Name"/>
                    <div class="card-input">
                        <input type="text" placeholder="Card Number"/>
                        <img src="./images/credit-card.svg" class="credit-card"/>
                    </div>
                <input type="text" placeholder="Date"/>
                <input type="text" placeholder="CVV"/>
                <div class="country-select-container">
                    <label for="country"></label>
                    <select id="country"  class="country-dropdown">
                        <option value="" disabled selected>Country</option>
                        <option value="US">United States</option>
                        <option value="CN">China</option>
                        <option value="GE">Georgia</option>
                    </select>
                </div>
                <input type="text" placeholder="Zip"/>
                <input type="text" placeholder="Discount Code"/>
            </form>

            <input type="checkbox"/>
            <p>I accept the Terms of Service and Privacy Policy</p>
            <button>Get started $199 $249</button>
            <a href="#" class="coupon">Have a coupon?</a>
        </div>
    </section>
</body>
</html>
